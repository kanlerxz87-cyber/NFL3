name: Validate and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the readiness builder and the skill-lab test both check that a
          # pre-registration commit predates the commit that added the results artifact.
          fetch-depth: 0
      - name: Validate root pages, local links and table citations
        run: python3 scripts/validate_site.py
      - name: Existing root site checks
        run: python3 tests/check_site.py
      - name: Decision desk checks (data, links, row citations, blanks)
        run: python3 decision-desk/scripts/check.py
      - name: Shadow board gate (pre-registration order, price firewall, reproducibility)
        run: python3 shadow-board/scripts/check.py
      - name: Price-store policy, ingestion tests, deterministic page build and integrity check
        run: |
          python3 pricing/test_pricing.py
          python3 pricing/build.py
          python3 pricing/verify.py
          git diff --exit-code -- pricing pricing.html
      - name: Frozen-corpus tests, deterministic page build and preregistration check
        run: |
          python3 corpus/test_corpus.py
          python3 corpus/build.py
          python3 corpus/verify.py
          git diff --exit-code -- corpus corpus.html
      - name: Two-total workspace (registration order, corpus hash, arithmetic, blanks, determinism)
        run: python3 two-total/scripts/verify.py

      - name: Decision lab offline tests
        run: python3 tests/test_decision_lab.py
      - name: Independent line-by-line source verification
        run: python3 decision-lab/scripts/verify_sources.py
      - name: Build canonical decision lab
        run: python3 decision-lab/scripts/build.py
      - name: Injury-report archive tests (synthetic fixtures, no network)
        run: python3 tests/test_injury_capture.py
      - name: Check decision-readiness matrix and unknown-threshold flags
        run: python3 tests/test_readiness.py
      - name: Independent source/link audit
        run: python3 decision-lab/scripts/audit.py
      - name: Availability join artifact is reproducible
        run: |
          python3 decision-lab/scripts/availability.py
          if ! git diff --exit-code -- decision-lab/data/availability.json; then
            echo "::error::availability.json is stale. Run decision-lab/scripts/availability.py and commit the result."
            exit 1
          fi
      - name: Verification - offline structural families
        run: python3 decision-lab/scripts/verify_live.py --offline
      - name: Verification lab build and fail-closed checks
        run: |
          python3 verification-lab/scripts/build.py
          python3 tests/test_verification_lab.py
      - name: Origination workspace unit tests
        run: python3 tests/test_origination.py
      - name: Origination workspace build
        run: python3 origination/scripts/build.py
      - name: Origination artifacts match a rebuild from committed inputs (drift alarm)
        run: |
          echo "::notice::input sha256 (manifest, official_snapshot, games): $(sha256sum data/raw/manifest.json decision-lab/data/official_snapshot.json data/raw/games.csv | awk '{print $1}' | tr '\n' ' ')"
          if [ -n "$(git status --porcelain -- origination/)" ]; then
            STATUS=$(git status --porcelain -- origination/ | tr '\n' ' ')
            DIFF=$(git diff -U0 -- origination/ | head -c 1500 | tr '\n' '|')
            echo "::error::origination/ differs from a rebuild of the committed inputs. status: ${STATUS} diff: ${DIFF}"
            exit 1
          fi
      - name: Origination fail-closed verification (sources, links, determinism, gates)
        run: python3 origination/scripts/verify.py
      - name: Skill-lab regression tests (protocol, scores, published pages)
        run: python3 tests/test_skill_lab.py
      - name: Skill-lab fail-closed verification
        run: python3 skill-lab/scripts/verify.py
      - name: Availability-ledger regression tests (capture digests, joins, published pages)
        run: python3 tests/test_availability_ledger.py
      - name: Availability-ledger fail-closed verification
        run: python3 availability-ledger/scripts/verify.py
      - name: Matchup workspace gate (provenance, recomputed arithmetic, blank-cell reasons)
        run: python3 matchup/scripts/check.py
      - name: Matchup workspace artifacts are reproducible from the committed inputs
        run: |
          python3 matchup/scripts/build.py
          python3 matchup/scripts/pages.py
          if ! git diff --exit-code -- matchup/; then
            echo "::error::matchup/ is stale. Run build.py then pages.py and commit the result."
            exit 1
          fi
      - name: Injury-archive tests (synthetic fixtures, no network)
        run: |
          python3 tests/test_injury_archive.py
          python3 tests/test_injury_archive_pipeline.py
      - name: Injury-archive fail-closed verification (digests, gates, pre-registration order)
        run: python3 injury-archive/scripts/verify.py
      - name: Forward ledger - verified results feed, cross-checks, pre-registration order, row citations
        run: |
          python3 forward-ledger/scripts/build_ledger.py
          python3 forward-ledger/scripts/availability_w10.py
          python3 forward-ledger/scripts/crosscheck_standings.py
          python3 forward-ledger/scripts/build_site.py
          python3 forward-ledger/scripts/verify.py
          git diff --exit-code -- forward-ledger
      - name: Root questions and suggestions pages match the merged register
        run: python3 questions/build.py --check

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refresh official decision-lab captures
        continue-on-error: true
        run: python3 decision-lab/scripts/capture_official.py --discover-depth --output decision-lab/data/official_snapshot.json
      - name: Flag depth cells that still need a fresh capture
        run: python3 decision-lab/scripts/add_depth_integrity.py
      - name: Rebuild and audit decision lab for publication
        run: |
          python3 decision-lab/scripts/verify_sources.py
          python3 decision-lab/scripts/build.py
          python3 decision-lab/scripts/audit.py
      - name: Availability analysis from the refreshed capture
        continue-on-error: true
        run: python3 decision-lab/scripts/availability.py
      - name: Verification - live field-by-field re-fetch
        id: verification
        continue-on-error: true
        run: python3 decision-lab/scripts/verify_live.py
      - name: Rebuild pages and fail closed on an unusable capture
        run: python3 decision-lab/scripts/publish_prepare.py
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification
          path: decision-lab/data/verification.json
          retention-days: 30
      - name: Validate combined root site
        run: python3 scripts/validate_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
