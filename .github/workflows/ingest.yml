name: ingest
on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/ingest.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official release assets
        run: |
          mkdir -p /tmp/probe
          set -x
          for u in \
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_2026.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/schedules/schedules.csv" ; do
            curl -sSL --retry 3 --max-time 120 -o "/tmp/probe/$(basename $u)" -w "%{http_code} %{size_download} %{url_effective}\n" "$u"
          done
          ls -la /tmp/probe
          head -c 400 /tmp/probe/injuries_2026.csv
