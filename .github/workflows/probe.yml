name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch schema samples from official nflverse releases
        run: |
          mkdir -p pipeline/probe
          fetch() {
            name="$1"; url="$2"
            code=$(curl -sSL --retry 3 --max-time 300 -o "pipeline/probe/$name.tmp" -w "%{http_code}" "$url")
            size=$(stat -c%s "pipeline/probe/$name.tmp" 2>/dev/null || echo 0)
            sha=$(sha256sum "pipeline/probe/$name.tmp" | cut -d' ' -f1)
            echo "$name|$code|$size|$sha|$url" >> pipeline/probe/manifest.txt
            head -4 "pipeline/probe/$name.tmp" > "pipeline/probe/$name.head"
            rm -f "pipeline/probe/$name.tmp"
          }
          fetch injuries_2026 "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_2026.csv"
          fetch depth_2026 "https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_2026.csv"
          fetch snaps_2026 "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_2026.csv"
          fetch teamweek_2026 "https://github.com/nflverse/nflverse-data/releases/download/stats_team/stats_team_week_2026.csv"
          fetch sched "https://github.com/nflverse/nflverse-data/releases/download/schedules/schedules.csv"
          fetch rosters_2026 "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv"
          fetch playerweek_2026 "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv"
          fetch pbp_2026 "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2026.csv"
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/probe
          git commit -m "chore(probe): official nflverse schema samples" || true
          git push
