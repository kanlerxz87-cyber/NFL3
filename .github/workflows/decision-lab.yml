name: Decision lab checks and official-source capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'decision-lab/scripts/**'
      - 'decision-lab/templates/**'
      - 'decision-lab/assets/**'
      - 'tests/test_decision_lab.py'
      - '.github/workflows/decision-lab.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture official HTTPS sources for line-by-line review
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path('decision-lab/data/captures')
          out.mkdir(parents=True, exist_ok=True)
          sources = {
              'nfl-injuries': 'https://www.nfl.com/injuries/',
              'colts-depth': 'https://www.colts.com/news/colts-release-unofficial-depth-chart-for-week-10',
              'nfl-teams': 'https://www.nfl.com/teams/',
              'commanders-depth': 'https://www.commanders.com/team/depth-chart',
              'giants-depth': 'https://www.giants.com/team/depth-chart',
          }
          manifest = []
          for name, url in sources.items():
              request = urllib.request.Request(url, headers={'User-Agent': 'NFL3-ResearchSourceAudit/1.0 (public source review)'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  host = response.geturl().split('/')[2]
                  if host not in {'www.nfl.com', 'www.colts.com', 'www.commanders.com', 'www.giants.com'}:
                      raise RuntimeError('Unexpected redirect host')
                  raw = response.read(12_000_000)
              (out / (name + '.html.gz')).write_bytes(gzip.compress(raw, mtime=0))
              manifest.append({'id': name, 'url': url, 'final_url': response.geturl(), 'observed_at': datetime.now(timezone.utc).isoformat(), 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Save temporary primary-source captures on the fixed session branch
        if: github.event_name == 'pull_request' && github.head_ref == 'arena/c2825205-nfl3'
        shell: bash
        run: |
          git config user.name "nfl3-source-audit"
          git config user.email "nfl3-source-audit@users.noreply.github.com"
          git add decision-lab/data/captures
          if ! git diff --cached --quiet; then
            git commit -m "chore: temporary primary-source captures for verification [skip ci]"
            git push origin HEAD:arena/c2825205-nfl3
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-captures
          path: decision-lab/data/captures/
          retention-days: 7
          if-no-files-found: error
