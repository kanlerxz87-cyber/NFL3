name: Decision lab checks and official-source capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'decision-lab/**'
      - 'tests/test_decision_lab.py'
      - '.github/workflows/decision-lab.yml'

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture official HTTPS sources without interpreting missing fields
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path('source-captures')
          out.mkdir()
          sources = {
              'nfl-injuries': 'https://www.nfl.com/injuries/',
              'colts-depth': 'https://www.colts.com/news/colts-release-unofficial-depth-chart-for-week-10',
              'nfl-teams': 'https://www.nfl.com/teams/',
          }
          manifest = []
          for name, url in sources.items():
              request = urllib.request.Request(url, headers={'User-Agent': 'NFL3-ResearchSourceAudit/1.0 (public source review)'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.geturl().split('/')[2] not in {'www.nfl.com', 'www.colts.com'}:
                      raise RuntimeError('Unexpected redirect host')
                  raw = response.read(12_000_000)
              (out / (name + '.html')).write_bytes(raw)
              manifest.append({'id': name, 'url': url, 'final_url': response.geturl(), 'observed_at': datetime.now(timezone.utc).isoformat(), 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-captures
          path: source-captures/
          retention-days: 7
          if-no-files-found: error
