name: data-refresh

# Full pipeline, automated:
#   1. fetch the official nflverse release assets and verify each against its published SHA-256
#   2. run the engine self-tests
#   3. build the static research desk from the verified snapshot
#   4. check every table row carries an official source link and every local link resolves
#   5. commit the refreshed snapshot + rebuilt pages back to the branch
#
# Publication is deliberately NOT done here. The repository publishes one site from the repository root
# via pages.yml; a second Pages upload would race it and replace the whole site with research-desk/ alone.
on:
  schedule:
    - cron: '23 10 * * *'   # daily refresh of the official snapshot
  push:
    branches: ['main', 'arena/f9dd481e-nfl3']
    # no path filter: GitHub skips schedule runs entirely when a workflow has a path filter, and a
    # reliable daily refresh matters more than skipping a few no-op builds
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and verify official sources
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-fetch]')
        run: |
          set -o pipefail
          python3 pipeline/fetch_official.py --dest data/raw --history 2>&1 | tee /tmp/fetch.log
          python3 pipeline/require_manifest.py data/raw/manifest.json --min-files 10

      - name: Engine self-tests
        run: python3 engine/test_engine.py

      - name: Build the research desk
        run: python3 engine/build.py

      - name: Verify the published site
        run: python3 tests/check_research_desk.py research-desk

      - name: Verify the root site and sub-sites
        run: python3 scripts/validate_site.py

      - name: Commit refreshed snapshot and site
        run: |
          git config user.name "nfl3-bot"
          git config user.email "nfl3-bot@users.noreply.github.com"
          git add -A data lab/results research-desk
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(data): refresh official snapshot and rebuild site [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
