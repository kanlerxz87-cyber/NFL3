name: data-and-site

# Full pipeline, automated:
#   1. fetch the official nflverse release assets and verify each against its published SHA-256
#   2. run the engine self-tests
#   3. build the static research desk from the verified snapshot
#   4. check every table row carries an official source link and every local link resolves
#   5. commit the refreshed snapshot + site back to the branch, and publish to GitHub Pages
#
# Triggered on main and on the working branch, so the branch preview is always current.
on:
  schedule:
    - cron: '23 10 * * *'   # daily refresh of the official snapshot
  push:
    branches: ['main', 'arena/f9dd481e-nfl3']
    paths:
      - 'pipeline/**'
      - 'engine/**'
      - 'lab/assets/**'
      - '.github/workflows/data-and-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-and-site-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and verify official sources
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-fetch]')
        run: |
          set -o pipefail
          python3 pipeline/fetch_official.py --dest data/raw --history 2>&1 | tee /tmp/fetch.log
          python3 pipeline/require_manifest.py data/raw/manifest.json --min-files 10

      - name: Engine self-tests
        run: python3 engine/test_engine.py

      - name: Build the research desk
        run: python3 engine/build.py

      - name: Verify the published site
        run: python3 tests/check_site.py site

      - name: Commit refreshed snapshot and site
        run: |
          git config user.name "nfl3-bot"
          git config user.email "nfl3-bot@users.noreply.github.com"
          git add -A data lab/results site
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(data): refresh official snapshot and rebuild site [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'arena/f9dd481e-nfl3'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
